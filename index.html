<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Mangá Online</title>
</head>
<body>
    <header>
        <!--1 PASSO - BANNER-->
        <div class="banner-container">
            <img src="./Assets/Banner1.jpg" alt="--BANNER">
        </div>
        <!--2 PASSO - TITULO-->
        <div>
            <h1 class="h1">Dragon Ball - Volume 1</h1>
        </div>
    </header>
    <main class="reader-container">
        <!--IMAGEM DA PAGINA ATUAL-->
        <div class="page-wrapper">
            <img id="manga-page" src="./Assets/Dr. Stone (1).jpg" alt="capa">
        </div>
        <!--PAINEL DE CONTROLE-->
        <div class="controls">
            <button id="prev-btn" class="btn">Anterior</button>
            <span id="page-counter" class="page-counter">Pagina 1 de 55</span>
            <button id="next-btn" class="btn">Próximo</button>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
